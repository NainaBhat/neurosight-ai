services:
  - type: web
    name: neurosight-ai
    runtime: node
    region: oregon
    plan: free
    pythonVersion: 3.11
    rootDir: .
    buildCommand: npm install && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://neurosight-ai.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FLASK_PORT
        value: "5000"
      - key: FLASK_ENV
        value: production
      - key: MODELS_DIR
        value: /var/tmp/models
      - key: MONGODB_DB
        value: neurosight
