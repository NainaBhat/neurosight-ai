services:
  - type: web
    name: neurosight-ai
    runtime: node
    plan: free
    region: oregon
    
    buildCommand: npm install --prefix backend && pip install -r backend/requirements.txt
    startCommand: cd backend && node server.js
    
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://neurosight-ai.vercel.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: FLASK_PORT
        value: "5000"
      - key: FLASK_ENV
        value: production
      - key: VITE_API_URL
        value: https://neurosight-ai-gj77.onrender.com
 



